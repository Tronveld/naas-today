<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naas Today</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFBF5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #2C2520;
        }
        .message {
            text-align: center;
            padding: 2rem;
        }
        .message p {
            font-size: 1rem;
            color: #4A4238;
            margin: 0.5rem 0 0;
        }
        .checkmark {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="message">
        <div class="checkmark">&#10003;</div>
        <h1>Tracking disabled on this browser.</h1>
        <p>Umami analytics will not run on this device.</p>
    </div>
    <script>
        localStorage.setItem('umami.disabled', 'true');
    </script>
</body>
</html>
