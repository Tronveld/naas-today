name: Fetch events

# The site's freshness used to depend on someone remembering to run two scripts
# by hand. It went five and a half weeks without a library pull, and the page
# quietly showed nothing on most weekdays — no error, no warning. This runs them
# on a schedule so silence is no longer the failure mode.

on:
  schedule:
    # 05:10 UTC daily — 06:10 Irish summer time, 05:10 in winter. Before anyone
    # checks the site in the morning. Deliberately not on the hour: GitHub's
    # scheduler is busiest then and delays runs.
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not write to the database'
        type: boolean
        default: false

# Two runs writing at once would race on the duplicate check.
concurrency:
  group: fetch-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DRY: ${{ inputs.dry_run && '--dry-run' || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check credentials are present
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SECRET_KEY must be set as repository secrets."
            exit 1
          fi

      # --auto-approve: these feeds are vetted (Moat Theatre, WhatsOnTonight,
      # Naas Library) and every row is already date-validated, Naas-filtered and
      # duplicate-checked before insert. Reviewing ~88 machine rows a week to
      # find the ~1 human submission is what made the admin panel easy to
      # forget, and submissions then sat for weeks. Leaving `pending` to mean
      # "a person wrote this" is what makes the review step small enough to do.
      #
      # The retry lives inside the script now, per source (fetchWithRetry).
      # Retrying the whole run needed all five sources healthy in the same
      # attempt, so a run could fail with every source having succeeded at some
      # point — that is what turned 2026-08-22 and -23 red.
      - name: Scrape listing sources
        id: scrape
        continue-on-error: true
        run: node scripts/scrape-sources.js --auto-approve $DRY

      # Library RSS (pull-library-events.js) was moved to a local launchd job
      # on 2026-08-15 — Spydus returns 405 from GitHub Actions' datacenter IPs
      # but works from a residential connection. The plist is at
      # ~/Library/LaunchAgents/com.naastoday.pull-library-events.plist

      # Netlify's free plan is 300 credits a month and a production deploy costs
      # 15 of them flat — 20 deploys a month, shared with bandwidth and web
      # requests. Overspend and every project on the team is paused: visitors
      # get "Site not available" until the next billing cycle.
      - name: Check deploy budget
        id: budget
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/check-deploy-budget.js

      # Only rebuild when something actually arrived. Events are live for
      # visitors the moment they land (get-events is fetched client-side on
      # every page load); the rebuild exists solely to refresh the pre-rendered
      # HTML that first paint and SEO read. Rebuilding byte-identical content
      # costs the same 15 credits as rebuilding real changes, and most days
      # bring nothing new — 2 to 7 days a month, historically.
      - name: Trigger Netlify rebuild
        if: ${{ !cancelled() && !inputs.dry_run
                && steps.scrape.outputs.inserted > 0
                && steps.budget.outputs.allowed == 'true' }}
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not set — skipping the rebuild. New events are live for visitors but will be missing from the pre-rendered HTML until the next deploy."
            exit 0
          fi
          echo "New events arrived (scrape: ${{ steps.scrape.outputs.inserted }}) — rebuilding."
          curl -fsS -X POST -d '{}' "$HOOK"

      # Without this, a skipped rebuild is invisible in the run summary and
      # "nothing was published today" looks identical to "the step is broken".
      - name: Explain a skipped rebuild
        if: ${{ !cancelled() && !inputs.dry_run
                && steps.scrape.outputs.inserted == 0 }}
        run: echo "No new events today — skipping the rebuild and saving 15 Netlify credits."

      # Runs even when a fetcher failed: a broken scrape is no reason to leave
      # a waiting submission unmentioned. Not continue-on-error — a reminder
      # that cannot be delivered has to go red, since a notification failing
      # quietly is the exact bug this step exists to fix.
      - name: Email pending submissions
        if: ${{ !cancelled() }}
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: node scripts/notify-pending.js $DRY

      # This makes the job itself red if the scrape failed, so a persistent
      # break is visible instead of silent — silence caused the original problem.
      - name: Report failures
        if: ${{ !cancelled() && steps.scrape.outcome == 'failure' }}
        run: |
          echo "scrape: ${{ steps.scrape.outcome }}"
          echo "::error::Scraper failed — see the step logs above."
          exit 1
